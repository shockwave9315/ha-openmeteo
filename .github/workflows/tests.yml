name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (HA current / Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install test stack
        run: python -m pip install --prefer-binary -r requirements.txt

      - name: Show resolved versions
        run: |
          python - <<'PY'
          import importlib.metadata as im
          for pkg in ("homeassistant", "pytest-homeassistant-custom-component", "pytest"):
              print(pkg, "=>", im.version(pkg))
          PY

      - name: Validate dependencies
        run: python -m pip check

      - name: Validate Python sources
        run: python -m compileall -q custom_components/openmeteo tests

      - name: Validate JSON resources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [Path("hacs.json"), *Path("custom_components/openmeteo").rglob("*.json")]
          for path in paths:
              with path.open("r", encoding="utf-8") as file:
                  json.load(file)
              print("valid:", path)
          PY

      - name: Run tests
        run: pytest -q
